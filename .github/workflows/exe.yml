# Fabrique ClipForge.exe (version navigateur) et l'app PC ClipForge-Setup.exe (Electron, voir desktop/) sur Windows.
# - Chaque modification de l'app poussée sur main publie une nouvelle version (v1.0.<numéro du run>).
# - Un tag v* (ex. v1.0.0) publie l'exe dans les « Releases » du dépôt.
# - « Run workflow » (onglet Actions) avec un numéro de version le publie aussi (le tag est créé).
#   Laisser le champ vide : l'exe est seulement dans les artefacts du run.
name: ClipForge.exe

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['index.html', 'styles.css', 'js/**', 'server.js', 'build/**', 'desktop/**', '.github/workflows/exe.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex. v1.0.0), vide pour ne rien publier'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build/build-exe.js
      # L'app PC prend le numéro de la version publiée : c'est ce que compare la mise à jour automatique.
      - name: Version
        id: v
        shell: bash
        run: |
          V="${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('v1.0.{0}', github.run_number) }}"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "num=${V#v}" >> "$GITHUB_OUTPUT"
      - name: App PC (installateur)
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm version ${{ steps.v.outputs.num }} --no-git-tag-version --allow-same-version
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge
          path: |
            dist/ClipForge.exe
            dist/desktop/ClipForge-Setup.exe
      - if: github.event_name == 'push' || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/desktop/ClipForge-Setup.exe
            dist/desktop/ClipForge-Setup.exe.blockmap
            dist/desktop/latest.yml
            dist/ClipForge.exe
          body: |
            **Recommandé : ClipForge-Setup.exe** — la vraie app PC. Elle s'installe en un clic, avec un raccourci sur le bureau
            et dans le menu Démarrer, s'ouvre dans sa propre fenêtre et se met à jour toute seule. Les exports vont dans
            Téléchargements\ClipForge.

            ClipForge.exe — version sans installation, qui s'ouvre dans ton navigateur.

            Windows peut afficher « Windows a protégé votre ordinateur » (l'app n'est pas signée) :
            clique sur « Informations complémentaires » puis « Exécuter quand même ».
